---
# Prometheus ServiceMonitor for Zentra (P8)
# Requires prometheus-operator / kube-prometheus-stack
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: Zentra
  namespace: Zentra
  labels:
    app: Zentra
    release: prometheus
spec:
  selector:
    matchLabels:
      app: Zentra
      component: api
  endpoints:
    - port: api
      path: /api/v1/metrics
      interval: 30s
      scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
      - Zentra
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: Zentra-oracle-exporter
  namespace: Zentra
  labels:
    app: Zentra
    component: oracle-exporter
    release: prometheus
spec:
  selector:
    matchLabels:
      app: Zentra
      component: oracle-exporter
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s
  namespaceSelector:
    matchNames:
      - Zentra
