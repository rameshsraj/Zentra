# Item 17: OTel Collector Deployment for Zentra K8s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: Zentra
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"
    processors:
      memory_limiter:
        check_interval: 5s
        limit_mib: 512
        spike_limit_mib: 128
      batch:
        send_batch_size: 1024
        timeout: 5s
      resourcedetection:
        detectors: [system, env]
      tail_sampling:
        decision_wait: 10s
        num_traces: 100000
        policies:
          - name: errors-policy
            type: status_code
            status_code:
              status_codes: [ERROR]
          - name: latency-policy
            type: latency
            latency:
              threshold_ms: 5000
          - name: probabilistic-policy
            type: probabilistic
            probabilistic:
              sampling_percentage: 10
    exporters:
      otlphttp:
        endpoint: "http://zentra-api:5006"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "zentra_collector"
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, tail_sampling, batch]
          exporters: [otlphttp]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, batch]
          exporters: [otlphttp, prometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resourcedetection, batch]
          exporters: [otlphttp]
      telemetry:
        logs:
          level: info
        metrics:
          address: "0.0.0.0:8888"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: Zentra
  labels:
    app: Zentra
    component: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: Zentra
      component: otel-collector
  template:
    metadata:
      labels:
        app: Zentra
        component: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.111.0
          args: ["--config=/etc/otel/otel-collector-config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: prometheus
              containerPort: 8889
              protocol: TCP
            - name: health
              containerPort: 8888
              protocol: TCP
          volumeMounts:
            - name: otel-config
              mountPath: /etc/otel
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /
              port: 8888
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 8888
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: otel-config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: Zentra
  labels:
    app: Zentra
    component: otel-collector
spec:
  selector:
    app: Zentra
    component: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
    - name: prometheus
      port: 8889
      targetPort: 8889
      protocol: TCP
  type: ClusterIP
