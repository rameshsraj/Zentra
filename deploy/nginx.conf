# =============================================================================
# Zentra — Nginx Reverse Proxy Configuration
# Optional: place at /etc/nginx/sites-available/zentra
# This serves frontend on port 5010 and proxies /api to backend :5006
# =============================================================================

# Rate limiting zone for login endpoint: 5 requests/minute per IP, burst 3
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

server {
    listen 5010;
    server_name 10.88.11.162 localhost;

    root /store/Zentra/frontend/dist;
    index index.html;

    # =========================================================================
    # Security Headers
    # =========================================================================
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # Hide nginx version
    server_tokens off;

    # Serve React SPA — all non-API routes return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block sensitive files from being served
    location ~ /\.(env|git|gitignore|dockerignore) {
        deny all;
        return 404;
    }
    location ~ \.(toml|lock|rs|sql|sh|ps1)$ {
        deny all;
        return 404;
    }

    # Login endpoint with strict rate limiting
    location = /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # Agent binary downloads — proxy to backend so SPA fallback is never hit
    location /dl/ {
        proxy_pass http://127.0.0.1:5006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        # Binary downloads should not be gzip-compressed by nginx
        gzip off;
    }

    # Proxy /api/* to Rust backend
    location /api/ {
        proxy_pass http://127.0.0.1:5006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Prometheus metrics (internal only — require basic auth AND IP restriction for defense-in-depth)
    location /metrics {
        auth_basic "Zentra Metrics";
        auth_basic_user_file /etc/nginx/.htpasswd_metrics;
        allow 127.0.0.1;
        allow 10.88.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:5002;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;

    access_log /store/Zentra/logs/nginx_access.log;
    error_log  /store/Zentra/logs/nginx_error.log;
}
