## PostgreSQL Default Metrics — 10 Contexts

[[metric]]
context = "pg_connections"
labels = ["state"]
metrics_desc = { count = "Number of connections by state" }
metrics_type = { count = "gauge" }
request = "SELECT state, count(*) AS count FROM pg_stat_activity GROUP BY state"

[[metric]]
context = "pg_database_size"
labels = ["datname"]
metrics_desc = { size_bytes = "Database size in bytes" }
metrics_type = { size_bytes = "gauge" }
request = "SELECT datname, pg_database_size(datname) AS size_bytes FROM pg_database WHERE datistemplate = false"

[[metric]]
context = "pg_replication_lag"
labels = ["client_addr"]
metrics_desc = { lag_bytes = "Replication lag in bytes", lag_seconds = "Replication lag in seconds" }
metrics_type = { lag_bytes = "gauge", lag_seconds = "gauge" }
request = "SELECT client_addr::text, pg_wal_lsn_diff(pg_current_wal_lsn(), replay_lsn) AS lag_bytes, EXTRACT(EPOCH FROM (now() - pg_last_xact_replay_timestamp()))::float AS lag_seconds FROM pg_stat_replication"
ignore_zero_result = true

[[metric]]
context = "pg_table_bloat"
labels = ["schemaname", "relname"]
metrics_desc = { bloat_ratio = "Table bloat ratio", dead_tuples = "Dead tuples" }
metrics_type = { bloat_ratio = "gauge", dead_tuples = "gauge" }
request = "SELECT schemaname, relname, ROUND(CASE WHEN n_live_tup > 0 THEN n_dead_tup::float / n_live_tup ELSE 0 END, 4) AS bloat_ratio, n_dead_tup AS dead_tuples FROM pg_stat_user_tables ORDER BY n_dead_tup DESC FETCH FIRST 50 ROWS ONLY"

[[metric]]
context = "pg_index_usage"
labels = ["schemaname", "relname", "indexrelname"]
metrics_desc = { idx_scan = "Index scans", idx_tup_read = "Index tuples read", idx_tup_fetch = "Index tuples fetched" }
metrics_type = { idx_scan = "counter", idx_tup_read = "counter", idx_tup_fetch = "counter" }
request = "SELECT schemaname, relname, indexrelname, idx_scan, idx_tup_read, idx_tup_fetch FROM pg_stat_user_indexes ORDER BY idx_scan ASC FETCH FIRST 50 ROWS ONLY"

[[metric]]
context = "pg_lock_waits"
labels = ["mode"]
metrics_desc = { count = "Lock count by mode", wait_count = "Waiting locks" }
metrics_type = { count = "gauge", wait_count = "gauge" }
request = "SELECT mode, COUNT(*) AS count, COUNT(*) FILTER (WHERE granted = false) AS wait_count FROM pg_locks GROUP BY mode"

[[metric]]
context = "pg_cache_hit_ratio"
labels = ["datname"]
metrics_desc = { hit_ratio = "Cache hit ratio percent" }
metrics_type = { hit_ratio = "gauge" }
request = "SELECT datname, ROUND(100.0 * blks_hit / NULLIF(blks_hit + blks_read, 0), 2) AS hit_ratio FROM pg_stat_database WHERE datname NOT LIKE 'template%'"

[[metric]]
context = "pg_wal_stats"
labels = []
metrics_desc = { wal_records = "WAL records", wal_bytes = "WAL bytes written" }
metrics_type = { wal_records = "counter", wal_bytes = "counter" }
request = "SELECT wal_records, wal_bytes FROM pg_stat_wal"

[[metric]]
context = "pg_vacuum_stats"
labels = ["schemaname", "relname"]
metrics_desc = { last_vacuum_age_secs = "Seconds since last vacuum", last_autovacuum_age_secs = "Seconds since last autovacuum" }
metrics_type = { last_vacuum_age_secs = "gauge", last_autovacuum_age_secs = "gauge" }
request = "SELECT schemaname, relname, EXTRACT(EPOCH FROM (now() - last_vacuum))::float AS last_vacuum_age_secs, EXTRACT(EPOCH FROM (now() - last_autovacuum))::float AS last_autovacuum_age_secs FROM pg_stat_user_tables WHERE last_vacuum IS NOT NULL OR last_autovacuum IS NOT NULL ORDER BY last_autovacuum_age_secs DESC NULLS LAST FETCH FIRST 50 ROWS ONLY"

[[metric]]
context = "pg_slow_queries"
labels = ["queryid"]
metrics_desc = { calls = "Total calls", mean_exec_time = "Mean execution time (ms)", total_exec_time = "Total execution time (ms)" }
metrics_type = { calls = "counter", mean_exec_time = "gauge", total_exec_time = "counter" }
request = "SELECT queryid::text, calls, mean_exec_time, total_exec_time FROM pg_stat_statements ORDER BY mean_exec_time DESC FETCH FIRST 20 ROWS ONLY"
ignore_zero_result = true
