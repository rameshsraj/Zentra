# =============================================================================
# Zentra — Hardened Nginx Configuration (Docker)
# Serves frontend on port 5010, proxies /api/* to backend :5006
# SECURITY: This config is made immutable at container startup (chattr +i)
# =============================================================================

# ─── Rate limiting zones ─────────────────────────────────────────────────────
# Login: 5 req/min per IP (brute-force protection)
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
# General API: 30 req/s per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
# OTLP ingest: 100 req/s per IP (agents push frequently)
limit_req_zone $binary_remote_addr zone=otlp_limit:10m rate=100r/s;
# Auth endpoints (register/refresh): 10 req/min per IP
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

# ─── Connection limits ───────────────────────────────────────────────────────
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 5010 default_server;
    server_name _;

    root /opt/zentra/frontend/dist;
    index index.html;

    # =========================================================================
    # Global Request Limits — prevent buffer overflow / slow-loris attacks
    # =========================================================================
    client_max_body_size 2m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Max 100 concurrent connections per IP
    limit_conn conn_limit 100;

    # =========================================================================
    # Security Headers — applied to ALL responses
    # =========================================================================
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Hide server identity
    server_tokens off;

    # =========================================================================
    # Block dangerous HTTP methods
    # =========================================================================
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    # =========================================================================
    # Block common attack paths
    # =========================================================================
    location ~ /\.(env|git|gitignore|dockerignore|htaccess|htpasswd|svn|DS_Store) {
        deny all;
        return 404;
    }
    location ~ \.(toml|lock|rs|sql|sh|ps1|bak|orig|swp|swo)$ {
        deny all;
        return 404;
    }
    location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|xmlrpc\.php|cgi-bin|\.php|\.asp|\.aspx|\.jsp) {
        deny all;
        return 404;
    }

    # =========================================================================
    # Frontend — serve React SPA with caching headers
    # =========================================================================
    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # index.html must never be cached (SPA routing)
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
        }
    }

    # =========================================================================
    # Auth endpoints — strict rate limiting
    # =========================================================================
    location = /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
        proxy_hide_header X-Powered-By;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /api/auth/refresh {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
        proxy_hide_header X-Powered-By;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # =========================================================================
    # D05: Block internal/admin/debug endpoints from external access
    # =========================================================================
    location /api/system/ {
        allow 127.0.0.1;
        deny all;
        return 403;
    }
    location /api/pool-status {
        allow 127.0.0.1;
        deny all;
        return 403;
    }
    location /api/audit/ {
        allow 127.0.0.1;
        deny all;
        return 403;
    }
    location /api/data-audit {
        allow 127.0.0.1;
        deny all;
        return 403;
    }
    # Block API docs in production (exposes full API surface to attackers)
    location /api/docs {
        allow 127.0.0.1;
        deny all;
        return 403;
    }
    location /api/openapi.json {
        allow 127.0.0.1;
        deny all;
        return 403;
    }
    location /api/v1/openapi.json {
        allow 127.0.0.1;
        deny all;
        return 403;
    }

    # =========================================================================
    # Proxy /api/* to Rust backend (rate-limited)
    # =========================================================================
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_hide_header X-Powered-By;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Restrict request body size for API
        client_max_body_size 2m;
    }

    # =========================================================================
    # O16: OTLP HTTP ingest endpoints (rate-limited)
    # =========================================================================
    location /v1/ {
        limit_req zone=otlp_limit burst=200 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Encoding $http_content_encoding;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_hide_header X-Powered-By;
        client_max_body_size 10m;
    }

    # =========================================================================
    # Prometheus metrics — internal networks only
    # =========================================================================
    location /metrics {
        proxy_pass http://127.0.0.1:5006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header X-Powered-By;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    # =========================================================================
    # Block everything else not matched above
    # =========================================================================
    location ~ ^/(server-status|server-info|status) {
        deny all;
        return 404;
    }

    # =========================================================================
    # Compression (only for non-sensitive content types)
    # =========================================================================
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;
    gzip_vary on;

    access_log /opt/zentra/logs/nginx_access.log;
    error_log  /opt/zentra/logs/nginx_error.log warn;
}
