# =============================================================================
# Zentra — Nginx Configuration (Docker)
# Serves frontend on port 5010, proxies /api/* to backend :5006
# =============================================================================

# Rate limiting zone for login endpoint: 5 requests/minute per IP, burst 3
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

server {
    listen 5010;
    server_name _;

    root /opt/zentra/frontend/dist;
    index index.html;

    # =========================================================================
    # Security Headers
    # =========================================================================
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # Hide nginx version
    server_tokens off;

    # Serve React SPA — all non-API routes return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Block sensitive files from being served
    location ~ /\.(env|git|gitignore|dockerignore) {
        deny all;
        return 404;
    }
    location ~ \.(toml|lock|rs|sql|sh|ps1)$ {
        deny all;
        return 404;
    }

    # Login endpoint with strict rate limiting
    location = /api/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:5006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # Proxy /api/* to Rust backend
    location /api/ {
        proxy_pass http://127.0.0.1:5006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # O16: Proxy OTLP HTTP ingest endpoints (/v1/*) to backend
    location /v1/ {
        proxy_pass http://127.0.0.1:5006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Encoding $http_content_encoding;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
        client_max_body_size 10m;
    }

    # D05: Block internal/admin/debug endpoints from external access
    location /api/system/ {
        allow 127.0.0.1;
        deny all;
        return 403;
    }
    location /api/pool-status {
        allow 127.0.0.1;
        deny all;
        return 403;
    }

    # Prometheus metrics endpoint (internal only)
    location /metrics {
        proxy_pass http://127.0.0.1:5006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;

    access_log /opt/zentra/logs/nginx_access.log;
    error_log  /opt/zentra/logs/nginx_error.log;
}
