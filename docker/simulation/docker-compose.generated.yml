# =============================================================================
# Zentra Datacenter Simulation - Docker Compose (TEMPLATE)
# DO NOT EDIT - This file is generated by setup.sh / setup.ps1
#
# The setup script auto-detects the host network and assigns IPs from
# the host's subnet so all simulated nodes are reachable by Zentra.
#
# Network: macvlan on host interface (real LAN IPs)
# SNMP Community: public (read-only)
# =============================================================================

networks:
  zentra-dc:
    driver: bridge
    # driver_opts (macvlan disabled on Windows):
      # parent: bridge
    ipam:
      config:
        - subnet: 10.100.0.0/24
          gateway: 10.100.0.1

services:

  # =========================================================================
  # LINUX SERVERS
  # =========================================================================

  # Linux Server 01 - Rocky Linux (Web Server role)
  srv-linux-01:
    image: rockylinux:8
    container_name: srv-linux-01
    hostname: srv-linux-01
    restart: unless-stopped
    networks:
      zentra-dc:
        ipv4_address: 10.100.0.11
    volumes:
      - ./configs/linux-server/snmpd-rocky.conf:/etc/snmp/snmpd.conf:ro
      - ./configs/linux-server/setup-linux.sh:/opt/setup.sh:ro
    entrypoint: ["/bin/bash", "/opt/setup.sh"]
    cap_add:
      - NET_ADMIN

  # Linux Server 02 - Ubuntu (App Server role)
  srv-linux-02:
    image: ubuntu:22.04
    container_name: srv-linux-02
    hostname: srv-linux-02
    restart: unless-stopped
    networks:
      zentra-dc:
        ipv4_address: 10.100.0.12
    volumes:
      - ./configs/linux-server/snmpd-ubuntu.conf:/etc/snmp/snmpd.conf:ro
      - ./configs/linux-server/setup-linux-ubuntu.sh:/opt/setup.sh:ro
    entrypoint: ["/bin/bash", "/opt/setup.sh"]
    cap_add:
      - NET_ADMIN

  # =========================================================================
  # WINDOWS SERVERS (SNMP simulation)
  # =========================================================================

  # Windows Server 01 - Windows Server 2022 (AD/DNS role)
  srv-win-01:
    image: polinux/snmpd:alpine
    container_name: srv-win-01
    hostname: srv-win-01
    restart: unless-stopped
    networks:
      zentra-dc:
        ipv4_address: 10.100.0.13
    volumes:
      - ./configs/windows-server/snmpd-win2022.conf:/etc/snmp/snmpd.conf:ro
      - ./configs/windows-server/setup-snmpd-ssh.sh:/opt/setup.sh:ro
    entrypoint: ["/bin/sh", "/opt/setup.sh"]

  # Windows Server 02 - Windows Server 2019 (File Server role)
  srv-win-02:
    image: polinux/snmpd:alpine
    container_name: srv-win-02
    hostname: srv-win-02
    restart: unless-stopped
    networks:
      zentra-dc:
        ipv4_address: 10.100.0.14
    volumes:
      - ./configs/windows-server/snmpd-win2019.conf:/etc/snmp/snmpd.conf:ro
      - ./configs/windows-server/setup-snmpd-ssh.sh:/opt/setup.sh:ro
    entrypoint: ["/bin/sh", "/opt/setup.sh"]

  # =========================================================================
  # NETWORK SWITCHES (SNMP simulation)
  # =========================================================================

  # Core Switch - Cisco Catalyst 9300
  sw-core-01:
    image: polinux/snmpd:alpine
    container_name: sw-core-01
    hostname: sw-core-01
    restart: unless-stopped
    networks:
      zentra-dc:
        ipv4_address: 10.100.0.15
    volumes:
      - ./configs/switches/snmpd-cisco-core.conf:/etc/snmp/snmpd.conf:ro
      - ./configs/windows-server/setup-snmpd-ssh.sh:/opt/setup.sh:ro
    entrypoint: ["/bin/sh", "/opt/setup.sh"]

  # Access Switch - Arista 7050X
  sw-access-01:
    image: polinux/snmpd:alpine
    container_name: sw-access-01
    hostname: sw-access-01
    restart: unless-stopped
    networks:
      zentra-dc:
        ipv4_address: 10.100.0.16
    volumes:
      - ./configs/switches/snmpd-arista-access.conf:/etc/snmp/snmpd.conf:ro
      - ./configs/windows-server/setup-snmpd-ssh.sh:/opt/setup.sh:ro
    entrypoint: ["/bin/sh", "/opt/setup.sh"]

  # =========================================================================
  # FIREWALL (SNMP simulation)
  # =========================================================================

  # Palo Alto Firewall
  fw-01:
    image: polinux/snmpd:alpine
    container_name: fw-01
    hostname: fw-01
    restart: unless-stopped
    networks:
      zentra-dc:
        ipv4_address: 10.100.0.17
    volumes:
      - ./configs/firewall/snmpd-paloalto.conf:/etc/snmp/snmpd.conf:ro
      - ./configs/windows-server/setup-snmpd-ssh.sh:/opt/setup.sh:ro
    entrypoint: ["/bin/sh", "/opt/setup.sh"]

  # =========================================================================
  # STORAGE ARRAY (SNMP simulation)
  # =========================================================================

  # Dell PowerStore
  stor-01:
    image: polinux/snmpd:alpine
    container_name: stor-01
    hostname: stor-01
    restart: unless-stopped
    networks:
      zentra-dc:
        ipv4_address: 10.100.0.18
    volumes:
      - ./configs/storage/snmpd-dell-powerstore.conf:/etc/snmp/snmpd.conf:ro
      - ./configs/windows-server/setup-snmpd-ssh.sh:/opt/setup.sh:ro
    entrypoint: ["/bin/sh", "/opt/setup.sh"]

  # =========================================================================
  # MIDDLEWARE
  # =========================================================================

  # Nginx Reverse Proxy
  mw-nginx-01:
    image: nginx:1.25-alpine
    container_name: mw-nginx-01
    hostname: mw-nginx-01
    restart: unless-stopped
    networks:
      zentra-dc:
        ipv4_address: 10.100.0.19
    volumes:
      - ./configs/middleware/nginx-sim.conf:/etc/nginx/conf.d/default.conf:ro
      - ./configs/middleware/nginx-status.conf:/etc/nginx/conf.d/status.conf:ro
      - ./configs/middleware/setup-nginx-ssh.sh:/opt/setup.sh:ro
    entrypoint: ["/bin/sh", "/opt/setup.sh"]

  # Apache HTTP Server
  mw-apache-01:
    image: httpd:2.4-alpine
    container_name: mw-apache-01
    hostname: mw-apache-01
    restart: unless-stopped
    networks:
      zentra-dc:
        ipv4_address: 10.100.0.20
    volumes:
      - ./configs/middleware/httpd-sim.conf:/usr/local/apache2/conf/extra/httpd-status.conf:ro
      - ./configs/middleware/httpd-entry.sh:/opt/entry.sh:ro
    entrypoint: ["/bin/sh", "/opt/entry.sh"]

  # Apache Tomcat
  mw-tomcat-01:
    image: tomcat:9-jdk17
    container_name: mw-tomcat-01
    hostname: mw-tomcat-01
    restart: unless-stopped
    networks:
      zentra-dc:
        ipv4_address: 10.100.0.21
    volumes:
      - ./configs/middleware/tomcat-users.xml:/usr/local/tomcat/conf/tomcat-users.xml:ro
      - ./configs/middleware/tomcat-context.xml:/usr/local/tomcat/webapps/manager/META-INF/context.xml:ro
      - ./configs/middleware/setup-tomcat-ssh.sh:/opt/setup.sh:ro
    entrypoint: ["/bin/bash", "/opt/setup.sh"]
    environment:
      - CATALINA_OPTS=-Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.port=9090 -Dcom.sun.management.jmxremote.rmi.port=9090 -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false

  # =========================================================================
  # DATABASE
  # =========================================================================

  # Oracle Database 19c XE
  db-oracle-01:
    image: gvenzl/oracle-xe:21-slim
    container_name: db-oracle-01
    hostname: db-oracle-01
    restart: unless-stopped
    user: root
    networks:
      zentra-dc:
        ipv4_address: 10.100.0.22
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./configs/oracle/init-oracle.sql:/container-entrypoint-initdb.d/init-oracle.sql:ro
      - ./configs/oracle/setup-oracle-ssh.sh:/opt/setup-ssh.sh:ro
    entrypoint: ["/bin/bash", "/opt/setup-ssh.sh"]
    environment:
      - ORACLE_PASSWORD=zentra123
      - ORACLE_DATABASE=ZENTRADB
      - ORACLE_CHARACTERSET=AL32UTF8
    shm_size: "1g"

volumes:
  oracle-data:
