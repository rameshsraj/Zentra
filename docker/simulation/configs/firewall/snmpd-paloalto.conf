# Palo Alto Firewall SNMP Simulation
# fw-01

sysLocation    "Datacenter MDF, Rack S01"
sysContact     "secops@zentra.local"
sysName        PA-FW-01
sysDescr       "Palo Alto Networks PA-3260 series firewall, PAN-OS 11.1.2"
sysObjectID    .1.3.6.1.4.1.25461.2.3.18

rocommunity    public
agentAddress   udp:161

# sysUpTime
pass .1.3.6.1.2.1.1.3.0 /bin/sh -c "echo .1.3.6.1.2.1.1.3.0; echo timeticks; awk 'BEGIN{srand(); print int(2592000*100 + rand()*8640000)}'"

