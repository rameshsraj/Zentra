pass .1.3.6.1.2.1.2.2.1.10.1 /bin/sh -c "echo .1.3.6.1.2.1.2.2.1.10.1; echo counter; awk 'BEGIN{srand(); print int(3000000000+rand()*1000000000)}'"
pass .1.3.6.1.2.1.2.2.1.16.1 /bin/sh -c "echo .1.3.6.1.2.1.2.2.1.16.1; echo counter; awk 'BEGIN{srand(); print int(2000000000+rand()*1000000000)}'"

