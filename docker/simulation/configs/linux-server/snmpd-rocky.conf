# Rocky Linux Server - SNMP Configuration
# srv-linux-01 (Web Server role)

sysLocation    "Datacenter Rack A01, Unit 12"
sysContact     "admin@zentra.local"
sysName        srv-linux-01
sysDescr       "Linux srv-linux-01 4.18.0-513.el8.x86_64 #1 SMP Rocky Linux 8.10 x86_64"

rocommunity    public

agentAddress   udp:161

view    systemonly  included   .1.3.6.1.2.1.1
view    systemonly  included   .1.3.6.1.2.1.25
view    systemonly  included   .1.3.6.1.2.1.2
view    systemonly  included   .1.3.6.1.4.1.2021

# Disk monitoring
disk    /       10%
disk    /var    10%

# Load average monitoring
load    12 10 5

# Memory monitoring (from UCD-SNMP-MIB)
# Automatically exposed via .1.3.6.1.4.1.2021.4

# CPU monitoring
# Automatically exposed via .1.3.6.1.4.1.2021.11

# Network interfaces
# Automatically exposed via .1.3.6.1.2.1.2 (IF-MIB)

# Process monitoring
proc    sshd
proc    nginx
proc    crond

# Extend with custom scripts
extend  uptime     /usr/bin/uptime
extend  hostname   /usr/bin/hostname
