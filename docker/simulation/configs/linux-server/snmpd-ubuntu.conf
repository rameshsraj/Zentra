# Ubuntu Server - SNMP Configuration
# srv-linux-02 (App Server role)

sysLocation    "Datacenter Rack A02, Unit 8"
sysContact     "admin@zentra.local"
sysName        srv-linux-02
sysDescr       "Linux srv-linux-02 5.15.0-91-generic #101-Ubuntu SMP Ubuntu 22.04.3 LTS x86_64"

rocommunity    public

agentAddress   udp:161

view    systemonly  included   .1.3.6.1.2.1.1
view    systemonly  included   .1.3.6.1.2.1.25
view    systemonly  included   .1.3.6.1.2.1.2
view    systemonly  included   .1.3.6.1.4.1.2021

# Disk monitoring
disk    /       10%
disk    /var    10%
disk    /tmp    10%

# Load average monitoring
load    12 10 5

# Process monitoring
proc    sshd
proc    java
proc    cron

# Extend with custom scripts
extend  uptime     /usr/bin/uptime
extend  hostname   /usr/bin/hostname
