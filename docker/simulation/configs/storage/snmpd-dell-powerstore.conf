# Dell PowerStore Storage Array SNMP Simulation
# stor-01

sysLocation    "Datacenter Rack S02, Unit 1-4"
sysContact     "storage-admin@zentra.local"
sysName        STOR-PS-01
sysDescr       "Dell EMC PowerStore 500T, PowerStoreOS 3.5.0.0-1234567"
sysObjectID    .1.3.6.1.4.1.674.11000.2000.100

rocommunity    public
agentAddress   udp:161

# sysUpTime
pass .1.3.6.1.2.1.1.3.0 /bin/sh -c "echo .1.3.6.1.2.1.1.3.0; echo timeticks; awk 'BEGIN{srand(); print int(7776000*100 + rand()*8640000)}'"

# IF-MIB - Storage network interfaces
# iSCSI Port eth0
pass .1.3.6.1.2.1.2.2.1.2.1 /bin/sh -c "echo .1.3.6.1.2.1.2.2.1.2.1; echo string; echo 'eth-port0 iSCSI'"
pass .1.3.6.1.2.1.2.2.1.5.1 /bin/sh -c "echo .1.3.6.1.2.1.2.2.1.5.1; echo gauge; echo 25000000000"
pass .1.3.6.1.2.1.2.2.1.8.1 /bin/sh -c "echo .1.3.6.1.2.1.2.2.1.8.1; echo integer; echo 1"
pass .1.3.6.1.2.1.2.2.1.10.1 /bin/sh -c "echo .1.3.6.1.2.1.2.2.1.10.1; echo counter; awk 'BEGIN{srand(); print int(1000000000+rand()*3000000000)}'"
pass .1.3.6.1.2.1.2.2.1.16.1 /bin/sh -c "echo .1.3.6.1.2.1.2.2.1.16.1; echo counter; awk 'BEGIN{srand(); print int(800000000+rand()*2000000000)}'"

# Management Port
pass .1.3.6.1.2.1.2.2.1.2.2 /bin/sh -c "echo .1.3.6.1.2.1.2.2.1.2.2; echo string; echo 'mgmt-port0'"
pass .1.3.6.1.2.1.2.2.1.5.2 /bin/sh -c "echo .1.3.6.1.2.1.2.2.1.5.2; echo gauge; echo 1000000000"
pass .1.3.6.1.2.1.2.2.1.8.2 /bin/sh -c "echo .1.3.6.1.2.1.2.2.1.8.2; echo integer; echo 1"

# ifNumber
pass .1.3.6.1.2.1.2.1.0 /bin/sh -c "echo .1.3.6.1.2.1.2.1.0; echo integer; echo 8"

# HOST-RESOURCES-MIB - Storage pools
# Pool: Production (Total 50TB)
pass .1.3.6.1.2.1.25.2.3.1.3.1 /bin/sh -c "echo .1.3.6.1.2.1.25.2.3.1.3.1; echo string; echo 'Pool: Production'"
pass .1.3.6.1.2.1.25.2.3.1.4.1 /bin/sh -c "echo .1.3.6.1.2.1.25.2.3.1.4.1; echo integer; echo 1048576"
pass .1.3.6.1.2.1.25.2.3.1.5.1 /bin/sh -c "echo .1.3.6.1.2.1.25.2.3.1.5.1; echo integer; echo 52428800"
pass .1.3.6.1.2.1.25.2.3.1.6.1 /bin/sh -c "echo .1.3.6.1.2.1.25.2.3.1.6.1; echo integer; echo 36700160"

# Pool: Archive (Total 100TB)
pass .1.3.6.1.2.1.25.2.3.1.3.2 /bin/sh -c "echo .1.3.6.1.2.1.25.2.3.1.3.2; echo string; echo 'Pool: Archive'"
pass .1.3.6.1.2.1.25.2.3.1.4.2 /bin/sh -c "echo .1.3.6.1.2.1.25.2.3.1.4.2; echo integer; echo 1048576"
pass .1.3.6.1.2.1.25.2.3.1.5.2 /bin/sh -c "echo .1.3.6.1.2.1.25.2.3.1.5.2; echo integer; echo 104857600"
pass .1.3.6.1.2.1.25.2.3.1.6.2 /bin/sh -c "echo .1.3.6.1.2.1.25.2.3.1.6.2; echo integer; echo 62914560"

# ENTITY-MIB
pass .1.3.6.1.2.1.47.1.1.1.1.2.1 /bin/sh -c "echo .1.3.6.1.2.1.47.1.1.1.1.2.1; echo string; echo 'Dell EMC PowerStore 500T'"
pass .1.3.6.1.2.1.47.1.1.1.1.11.1 /bin/sh -c "echo .1.3.6.1.2.1.47.1.1.1.1.11.1; echo string; echo 'CKM00234500789'"

# Temperature
pass .1.3.6.1.2.1.99.1.1.1.4.1 /bin/sh -c "echo .1.3.6.1.2.1.99.1.1.1.4.1; echo integer; awk 'BEGIN{srand(); print 22+int(rand()*8)}'"

# Power supply status (1=ok)
pass .1.3.6.1.2.1.99.1.1.1.4.100 /bin/sh -c "echo .1.3.6.1.2.1.99.1.1.1.4.100; echo integer; echo 1"
pass .1.3.6.1.2.1.99.1.1.1.4.101 /bin/sh -c "echo .1.3.6.1.2.1.99.1.1.1.4.101; echo integer; echo 1"
