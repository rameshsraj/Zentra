# Windows Server 2019 SNMP Simulation
# srv-win-02 (File Server role)

sysLocation    "Datacenter Rack B02, Unit 10"
sysContact     "admin@zentra.local"
sysName        WIN-FS01
sysDescr       "Hardware: Intel64 Family 6 Model 79 Stepping 1 AT/AT COMPATIBLE - Software: Windows Version 6.3 (Build 17763 Multiprocessor Free)"
sysObjectID    .1.3.6.1.4.1.311.1.1.3.1.2

rocommunity    public
agentAddress   udp:161

# HOST-RESOURCES-MIB - hrSystemUptime
pass .1.3.6.1.2.1.25.1.1.0 /bin/sh -c "echo .1.3.6.1.2.1.25.1.1.0; echo timeticks; awk 'BEGIN{srand(); print int(172800*100 + rand()*8640000)}'"

# HOST-RESOURCES-MIB - hrSystemNumUsers
pass .1.3.6.1.2.1.25.1.5.0 /bin/sh -c "echo .1.3.6.1.2.1.25.1.5.0; echo gauge; echo 8"

# HOST-RESOURCES-MIB - hrSystemProcesses
pass .1.3.6.1.2.1.25.1.6.0 /bin/sh -c "echo .1.3.6.1.2.1.25.1.6.0; echo gauge; echo 142"

# HOST-RESOURCES-MIB - hrStorageDescr (C: drive)
pass .1.3.6.1.2.1.25.2.3.1.3.1 /bin/sh -c "echo .1.3.6.1.2.1.25.2.3.1.3.1; echo string; echo 'C:\\ Label:System  Serial Number 7e8f9a0b'"
# hrStorageSize (250GB in 4K blocks)
pass .1.3.6.1.2.1.25.2.3.1.5.1 /bin/sh -c "echo .1.3.6.1.2.1.25.2.3.1.5.1; echo integer; echo 65536000"
# hrStorageUsed (45% used)
pass .1.3.6.1.2.1.25.2.3.1.6.1 /bin/sh -c "echo .1.3.6.1.2.1.25.2.3.1.6.1; echo integer; echo 29491200"
# hrStorageAllocationUnits (4096 bytes)
pass .1.3.6.1.2.1.25.2.3.1.4.1 /bin/sh -c "echo .1.3.6.1.2.1.25.2.3.1.4.1; echo integer; echo 4096"

# HOST-RESOURCES-MIB - hrStorageDescr (D: drive - Data)
pass .1.3.6.1.2.1.25.2.3.1.3.3 /bin/sh -c "echo .1.3.6.1.2.1.25.2.3.1.3.3; echo string; echo 'D:\\ Label:Data  Serial Number 1c2d3e4f'"
# hrStorageSize (2TB in 4K blocks)
pass .1.3.6.1.2.1.25.2.3.1.5.3 /bin/sh -c "echo .1.3.6.1.2.1.25.2.3.1.5.3; echo integer; echo 524288000"
# hrStorageUsed (72% used)
pass .1.3.6.1.2.1.25.2.3.1.6.3 /bin/sh -c "echo .1.3.6.1.2.1.25.2.3.1.6.3; echo integer; echo 377487360"
# hrStorageAllocationUnits (4096 bytes)
pass .1.3.6.1.2.1.25.2.3.1.4.3 /bin/sh -c "echo .1.3.6.1.2.1.25.2.3.1.4.3; echo integer; echo 4096"

# HOST-RESOURCES-MIB - hrStorageDescr (Physical Memory)
pass .1.3.6.1.2.1.25.2.3.1.3.2 /bin/sh -c "echo .1.3.6.1.2.1.25.2.3.1.3.2; echo string; echo 'Physical Memory'"
# hrStorageSize (16GB in 1K blocks)
pass .1.3.6.1.2.1.25.2.3.1.5.2 /bin/sh -c "echo .1.3.6.1.2.1.25.2.3.1.5.2; echo integer; echo 16777216"
# hrStorageUsed (55% used)
pass .1.3.6.1.2.1.25.2.3.1.6.2 /bin/sh -c "echo .1.3.6.1.2.1.25.2.3.1.6.2; echo integer; echo 9227469"
# hrStorageAllocationUnits (1024 bytes)
pass .1.3.6.1.2.1.25.2.3.1.4.2 /bin/sh -c "echo .1.3.6.1.2.1.25.2.3.1.4.2; echo integer; echo 1024"

# HOST-RESOURCES-MIB - hrProcessorLoad (2 CPUs)
pass .1.3.6.1.2.1.25.3.3.1.2.1 /bin/sh -c "echo .1.3.6.1.2.1.25.3.3.1.2.1; echo integer; awk 'BEGIN{srand(); print 8+int(rand()*30)}'"
pass .1.3.6.1.2.1.25.3.3.1.2.2 /bin/sh -c "echo .1.3.6.1.2.1.25.3.3.1.2.2; echo integer; awk 'BEGIN{srand(); print 5+int(rand()*25)}'"

# IF-MIB - Network interfaces
pass .1.3.6.1.2.1.2.2.1.2.1 /bin/sh -c "echo .1.3.6.1.2.1.2.2.1.2.1; echo string; echo 'Intel(R) I350 Gigabit Network Connection'"
pass .1.3.6.1.2.1.2.2.1.5.1 /bin/sh -c "echo .1.3.6.1.2.1.2.2.1.5.1; echo gauge; echo 1000000000"
pass .1.3.6.1.2.1.2.2.1.8.1 /bin/sh -c "echo .1.3.6.1.2.1.2.2.1.8.1; echo integer; echo 1"
