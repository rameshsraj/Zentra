# Windows Server 2022 SNMP Simulation
# srv-win-01 (AD/DNS role)

sysLocation    "Datacenter Rack B01, Unit 4"
sysContact     "admin@zentra.local"
sysName        WIN-DC01
sysDescr       "Hardware: Intel64 Family 6 Model 85 Stepping 7 AT/AT COMPATIBLE - Software: Windows Version 6.3 (Build 20348 Multiprocessor Free)"
sysObjectID    .1.3.6.1.4.1.311.1.1.3.1.2

rocommunity    public
agentAddress   udp:161

# HOST-RESOURCES-MIB - hrSystemUptime
pass .1.3.6.1.2.1.25.1.1.0 /bin/sh -c "echo .1.3.6.1.2.1.25.1.1.0; echo timeticks; awk 'BEGIN{srand(); print int(86400*100 + rand()*8640000)}'"

# HOST-RESOURCES-MIB - hrSystemNumUsers
pass .1.3.6.1.2.1.25.1.5.0 /bin/sh -c "echo .1.3.6.1.2.1.25.1.5.0; echo gauge; echo 12"

# HOST-RESOURCES-MIB - hrSystemProcesses
pass .1.3.6.1.2.1.25.1.6.0 /bin/sh -c "echo .1.3.6.1.2.1.25.1.6.0; echo gauge; echo 187"

# HOST-RESOURCES-MIB - hrStorageDescr (C: drive)
pass .1.3.6.1.2.1.25.2.3.1.3.1 /bin/sh -c "echo .1.3.6.1.2.1.25.2.3.1.3.1; echo string; echo 'C:\\ Label:System  Serial Number 4a3b2c1d'"
# hrStorageSize (500GB in 4K blocks)
pass .1.3.6.1.2.1.25.2.3.1.5.1 /bin/sh -c "echo .1.3.6.1.2.1.25.2.3.1.5.1; echo integer; echo 131072000"
# hrStorageUsed (60% used)
pass .1.3.6.1.2.1.25.2.3.1.6.1 /bin/sh -c "echo .1.3.6.1.2.1.25.2.3.1.6.1; echo integer; echo 78643200"
# hrStorageAllocationUnits (4096 bytes)
pass .1.3.6.1.2.1.25.2.3.1.4.1 /bin/sh -c "echo .1.3.6.1.2.1.25.2.3.1.4.1; echo integer; echo 4096"

# HOST-RESOURCES-MIB - hrStorageDescr (Physical Memory)
pass .1.3.6.1.2.1.25.2.3.1.3.2 /bin/sh -c "echo .1.3.6.1.2.1.25.2.3.1.3.2; echo string; echo 'Physical Memory'"
# hrStorageSize (32GB in 1K blocks)
pass .1.3.6.1.2.1.25.2.3.1.5.2 /bin/sh -c "echo .1.3.6.1.2.1.25.2.3.1.5.2; echo integer; echo 33554432"
# hrStorageUsed (70% used)
pass .1.3.6.1.2.1.25.2.3.1.6.2 /bin/sh -c "echo .1.3.6.1.2.1.25.2.3.1.6.2; echo integer; echo 23488102"
# hrStorageAllocationUnits (1024 bytes)
pass .1.3.6.1.2.1.25.2.3.1.4.2 /bin/sh -c "echo .1.3.6.1.2.1.25.2.3.1.4.2; echo integer; echo 1024"

# HOST-RESOURCES-MIB - hrProcessorLoad (4 CPUs)
pass .1.3.6.1.2.1.25.3.3.1.2.1 /bin/sh -c "echo .1.3.6.1.2.1.25.3.3.1.2.1; echo integer; awk 'BEGIN{srand(); print 15+int(rand()*40)}'"
pass .1.3.6.1.2.1.25.3.3.1.2.2 /bin/sh -c "echo .1.3.6.1.2.1.25.3.3.1.2.2; echo integer; awk 'BEGIN{srand(); print 10+int(rand()*35)}'"
pass .1.3.6.1.2.1.25.3.3.1.2.3 /bin/sh -c "echo .1.3.6.1.2.1.25.3.3.1.2.3; echo integer; awk 'BEGIN{srand(); print 20+int(rand()*30)}'"
pass .1.3.6.1.2.1.25.3.3.1.2.4 /bin/sh -c "echo .1.3.6.1.2.1.25.3.3.1.2.4; echo integer; awk 'BEGIN{srand(); print 12+int(rand()*25)}'"

# IF-MIB - Network interfaces
# ifDescr
pass .1.3.6.1.2.1.2.2.1.2.1 /bin/sh -c "echo .1.3.6.1.2.1.2.2.1.2.1; echo string; echo 'Intel(R) Ethernet Connection (2) I219-V'"
# ifSpeed (1 Gbps)
pass .1.3.6.1.2.1.2.2.1.5.1 /bin/sh -c "echo .1.3.6.1.2.1.2.2.1.5.1; echo gauge; echo 1000000000"
# ifOperStatus (up)
pass .1.3.6.1.2.1.2.2.1.8.1 /bin/sh -c "echo .1.3.6.1.2.1.2.2.1.8.1; echo integer; echo 1"
