pass .1.3.6.1.2.1.2.2.1.8.1 /bin/sh -c "echo .1.3.6.1.2.1.2.2.1.8.1; echo integer; echo 1"
pass .1.3.6.1.2.1.2.2.1.10.1 /bin/sh -c "echo .1.3.6.1.2.1.2.2.1.10.1; echo counter; awk 'BEGIN{srand(); print int(800000000+rand()*800000000)}'"
pass .1.3.6.1.2.1.2.2.1.16.1 /bin/sh -c "echo .1.3.6.1.2.1.2.2.1.16.1; echo counter; awk 'BEGIN{srand(); print int(400000000+rand()*400000000)}'"

# Ethernet2
pass .1.3.6.1.2.1.2.2.1.2.2 /bin/sh -c "echo .1.3.6.1.2.1.2.2.1.2.2; echo string; echo 'Ethernet2'"
pass .1.3.6.1.2.1.2.2.1.5.2 /bin/sh -c "echo .1.3.6.1.2.1.2.2.1.5.2; echo gauge; echo 25000000000"
pass .1.3.6.1.2.1.2.2.1.8.2 /bin/sh -c "echo .1.3.6.1.2.1.2.2.1.8.2; echo integer; echo 1"
pass .1.3.6.1.2.1.2.2.1.10.2 /bin/sh -c "echo .1.3.6.1.2.1.2.2.1.10.2; echo counter; awk 'BEGIN{srand(); print int(600000000+rand()*600000000)}'"
pass .1.3.6.1.2.1.2.2.1.16.2 /bin/sh -c "echo .1.3.6.1.2.1.2.2.1.16.2; echo counter; awk 'BEGIN{srand(); print int(300000000+rand()*300000000)}'"

# Ethernet49 (uplink 100G)
pass .1.3.6.1.2.1.2.2.1.2.49 /bin/sh -c "echo .1.3.6.1.2.1.2.2.1.2.49; echo string; echo 'Ethernet49'"
pass .1.3.6.1.2.1.2.2.1.5.49 /bin/sh -c "echo .1.3.6.1.2.1.2.2.1.5.49; echo gauge; echo 100000000000"
pass .1.3.6.1.2.1.2.2.1.8.49 /bin/sh -c "echo .1.3.6.1.2.1.2.2.1.8.49; echo integer; echo 1"

# ENTITY-MIB
pass .1.3.6.1.2.1.47.1.1.1.1.2.1 /bin/sh -c "echo .1.3.6.1.2.1.47.1.1.1.1.2.1; echo string; echo 'DCS-7050SX3-48YC12'"
pass .1.3.6.1.2.1.47.1.1.1.1.11.1 /bin/sh -c "echo .1.3.6.1.2.1.47.1.1.1.1.11.1; echo string; echo 'JPE21340567'"

