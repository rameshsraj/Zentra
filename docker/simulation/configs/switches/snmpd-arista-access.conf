# Arista 7050X Access Switch SNMP Simulation
# sw-access-01

sysLocation    "Datacenter IDF-1, Rack N02"
sysContact     "netops@zentra.local"
sysName        SW-ACCESS-01
sysDescr       "Arista Networks EOS version 4.30.3M running on an Arista Networks DCS-7050SX3-48YC12"
sysObjectID    .1.3.6.1.4.1.30065.1.3011.7050.2655.48.2233.12

rocommunity    public
agentAddress   udp:161

# sysUpTime
pass .1.3.6.1.2.1.1.3.0 /bin/sh -c "echo .1.3.6.1.2.1.1.3.0; echo timeticks; awk 'BEGIN{srand(); print int(6912000*100 + rand()*8640000)}'"

# ifNumber
pass .1.3.6.1.2.1.2.1.0 /bin/sh -c "echo .1.3.6.1.2.1.2.1.0; echo integer; echo 56"

# IF-MIB - Key ports
# Ethernet1
pass .1.3.6.1.2.1.2.2.1.2.1 /bin/sh -c "echo .1.3.6.1.2.1.2.2.1.2.1; echo string; echo 'Ethernet1'"
