; =============================================================================
; Zentra — Supervisord Configuration
; Manages PostgreSQL, zentra-server, and Nginx inside a single container
; =============================================================================

[unix_http_server]
file=/var/run/supervisor.sock

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ---------------------------------------------------------------------------
; PostgreSQL 16
; Must start first — backend depends on it
; ---------------------------------------------------------------------------
[program:postgresql]
command=/usr/pgsql-16/bin/postgres -D /var/lib/postgresql/data/pgdata
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/postgresql.log
stderr_logfile=/var/log/supervisor/postgresql-error.log
startsecs=5
stopwaitsecs=30
stopsignal=INT

; ---------------------------------------------------------------------------
; zentra-server is defined at RUNTIME by docker-entrypoint.sh
; It is written to /etc/supervisord.d/zentra-env.conf with all env vars
; injected (DATABASE_URL, ZENTRA_JWT_SECRET, etc.) so the process
; receives its configuration. See docker-entrypoint.sh for details.
; ---------------------------------------------------------------------------

; ---------------------------------------------------------------------------
; Nginx (frontend + API reverse proxy)
; Starts after backend is up
; ---------------------------------------------------------------------------
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
startsecs=2
stdout_logfile=/opt/zentra/logs/nginx.log
stderr_logfile=/opt/zentra/logs/nginx-error.log
