; =============================================================================
; Zentra — Supervisord Configuration
; Manages PostgreSQL, zentra-server, and Nginx inside a single container
; =============================================================================

[unix_http_server]
file=/var/run/supervisor.sock

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ---------------------------------------------------------------------------
; PostgreSQL 16
; Must start first — backend depends on it
; ---------------------------------------------------------------------------
[program:postgresql]
command=/usr/pgsql-16/bin/postgres -D /var/lib/postgresql/data
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/postgresql.log
stderr_logfile=/var/log/supervisor/postgresql-error.log
startsecs=5
stopwaitsecs=30
stopsignal=INT

; ---------------------------------------------------------------------------
; Zentra API Server (Rust backend)
; Waits for PostgreSQL to be ready before starting
; D06: Runs as dedicated non-root 'zentra' user
; ---------------------------------------------------------------------------
[program:zentra-server]
command=/usr/local/bin/zentra-server
directory=/opt/zentra
user=zentra
autostart=true
autorestart=true
priority=20
startsecs=3
startretries=10
stopwaitsecs=15
stdout_logfile=/opt/zentra/logs/api.log
stderr_logfile=/opt/zentra/logs/api-error.log
environment=RUST_LOG="info",HOME="/opt/zentra"

; ---------------------------------------------------------------------------
; Nginx (frontend + API reverse proxy)
; Starts after backend is up
; ---------------------------------------------------------------------------
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
startsecs=2
stdout_logfile=/opt/zentra/logs/nginx.log
stderr_logfile=/opt/zentra/logs/nginx-error.log
