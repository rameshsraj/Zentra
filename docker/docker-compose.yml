# =============================================================================
# Zentra — Hardened Production Docker Compose
# Security-first deployment configuration
#
# Usage:
#   docker compose -f docker/docker-compose.yml up -d
#
# Required environment variables (set in .env or shell):
#   ZENTRA_JWT_SECRET        — 64+ char random secret for JWT signing
#   ZENTRA_DB_PASSWORD       — PostgreSQL password for zentra DB user
#   ZENTRA_ADMIN_PASSWORD    — Initial admin user password
# =============================================================================
version: "3.9"

services:
  zentra:
    image: zentra:latest
    container_name: zentra
    restart: unless-stopped

    # ── Port exposure ────────────────────────────────────────────────────────
    # Only Nginx (5010) is exposed. PostgreSQL (5434) and API (5006) are
    # container-internal only — never bind them to the host.
    ports:
      - "${ZENTRA_PORT:-5010}:5010"

    # ── Environment ──────────────────────────────────────────────────────────
    environment:
      # REQUIRED — must be set externally, never use defaults
      ZENTRA_JWT_SECRET: "${ZENTRA_JWT_SECRET:?Set ZENTRA_JWT_SECRET (64+ random chars)}"
      ZENTRA_DB_PASSWORD: "${ZENTRA_DB_PASSWORD:-zentra}"
      ZENTRA_ADMIN_PASSWORD: "${ZENTRA_ADMIN_PASSWORD:-admin}"

      # Security settings
      ZENTRA_ALLOW_ORIGINS: ""          # Empty = same-origin only (strictest)
      ZENTRA_BIND_ADDR: "127.0.0.1"    # API listens on loopback only (nginx proxies)
      RUST_LOG: "info,tower_http=warn"  # No debug logging in production

      # SSH (optional — only if monitoring remote hosts)
      ZENTRA_SSH_USER: "${ZENTRA_SSH_USER:-root}"
      ZENTRA_HOST: "${ZENTRA_HOST:-}"

    # ── Volumes ──────────────────────────────────────────────────────────────
    volumes:
      - zentra-data:/var/lib/postgresql/data

    # ── Security hardening ───────────────────────────────────────────────────
    # Read-only root filesystem — only tmpfs and named volumes are writable
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /var/run:rw,noexec,nosuid,nodev,size=16m
      - /var/log:rw,noexec,nosuid,nodev,size=128m
      - /opt/zentra/logs:rw,noexec,nosuid,nodev,size=64m
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=8m
      - /var/log/supervisor:rw,noexec,nosuid,nodev,size=32m
      - /var/log/nginx:rw,noexec,nosuid,nodev,size=32m
      - /var/log/postgresql:rw,noexec,nosuid,nodev,size=32m
      - /root/.ssh:rw,noexec,nosuid,nodev,size=4m
      - /opt/zentra/.ssh:rw,noexec,nosuid,nodev,size=4m
      - /tmp/zentra-ssh:rw,noexec,nosuid,nodev,size=4m

    # Prevent privilege escalation
    security_opt:
      - no-new-privileges:true

    # Drop ALL Linux capabilities, add back only what's strictly needed
    cap_drop:
      - ALL
    cap_add:
      - CHOWN            # chown files during init
      - SETUID           # supervisord switches to non-root users
      - SETGID           # supervisord switches groups
      - DAC_OVERRIDE     # read/write protected files during init
      - FOWNER           # change ownership during init
      - NET_BIND_SERVICE # bind to port 5010
      - LINUX_IMMUTABLE  # chattr +i for tamper protection

    # Limit resources to prevent container escape via resource exhaustion
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 512M

    # Process limits
    pids_limit: 200
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      core:
        soft: 0     # Disable core dumps
        hard: 0

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5010/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

    # DNS — don't leak internal resolver queries
    dns:
      - 127.0.0.1

    # Logging — prevent disk exhaustion from log spam
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  zentra-data:
    driver: local
